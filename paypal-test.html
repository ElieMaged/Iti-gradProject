<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Client ID Test</title>
</head>
<body>
    <h1>PayPal Client ID Test</h1>
    <div id="result"></div>
    
    <script>
        // Test your PayPal Client ID
        const clientId = 'AZ1lQZr90x4Wet1AtiWhxNi-0s1K7U3I7K7RSfq3xgb7S7tQP5Z3sHHtQPd1bbqG4m_p7R1Nj1bHv8zA';
        
        console.log('Testing PayPal Client ID:', clientId);
        
        // Create test script
        const script = document.createElement('script');
        script.src = `https://www.paypal.com/sdk/js?client-id=${clientId}&currency=USD&intent=capture&components=buttons,funding-eligibility`;
        script.async = true;
        
        script.onload = () => {
            console.log('✅ PayPal SDK loaded successfully');
            document.getElementById('result').innerHTML = '<p style="color: green;">✅ PayPal Client ID is valid!</p>';
        };
        
        script.onerror = (error) => {
            console.error('❌ PayPal SDK failed to load:', error);
            document.getElementById('result').innerHTML = '<p style="color: red;">❌ PayPal Client ID is invalid or from wrong environment</p>';
        };
        
        document.head.appendChild(script);
    </script>
</body>
</html>
