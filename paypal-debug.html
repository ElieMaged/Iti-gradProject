<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>PayPal Integration Debug Test</h1>
    
    <div id="status"></div>
    
    <button onclick="testPayPalSDK()">Test PayPal SDK Loading</button>
    <button onclick="testPayPalButton()">Test PayPal Button</button>
    <button onclick="clearStatus()">Clear Status</button>
    
    <div id="paypal-button-container"></div>
    
    <script>
        function log(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
            statusDiv.appendChild(div);
            console.log(message);
        }
        
        function clearStatus() {
            document.getElementById('status').innerHTML = '';
        }
        
        async function testPayPalSDK() {
            log('🔍 Starting PayPal SDK test...', 'info');
            
            const clientId = 'AZ1lQZr90x4Wet1AtiWhxNi-0s1K7U3I7K7RSfq3xgb7S7tQP5Z3sHHtQPd1bbqG4m_p7R1Nj1bHv8zA';
            
            log(`Client ID: ${clientId.substring(0, 20)}...`, 'info');
            log(`Client ID length: ${clientId.length}`, 'info');
            
            // Test SDK loading
            try {
                const script = document.createElement('script');
                script.src = `https://www.paypal.com/sdk/js?client-id=${clientId}&currency=USD&intent=capture&components=buttons,funding-eligibility`;
                script.async = true;
                
                const loadPromise = new Promise((resolve, reject) => {
                    script.onload = () => {
                        if (window.paypal) {
                            log('✅ PayPal SDK loaded successfully', 'success');
                            resolve();
                        } else {
                            log('❌ PayPal object not available after script load', 'error');
                            reject(new Error('PayPal object not available'));
                        }
                    };
                    
                    script.onerror = (error) => {
                        log('❌ PayPal SDK loading failed', 'error');
                        reject(error);
                    };
                });
                
                // Add timeout
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('SDK loading timeout')), 15000);
                });
                
                await Promise.race([loadPromise, timeoutPromise]);
                document.head.appendChild(script);
                
            } catch (error) {
                log(`❌ PayPal SDK test failed: ${error.message}`, 'error');
            }
        }
        
        async function testPayPalButton() {
            log('🔍 Testing PayPal button creation...', 'info');
            
            if (!window.paypal) {
                log('❌ PayPal SDK not loaded', 'error');
                return;
            }
            
            try {
                const container = document.getElementById('paypal-button-container');
                container.innerHTML = '<div>Creating PayPal button...</div>';
                
                const button = await window.paypal.Buttons({
                    createOrder: function(data, actions) {
                        log('Creating test order...', 'info');
                        return actions.order.create({
                            purchase_units: [{
                                amount: {
                                    value: '10.00'
                                },
                                description: 'Test payment'
                            }]
                        });
                    },
                    onApprove: function(data, actions) {
                        log('Payment approved, capturing...', 'info');
                        return actions.order.capture().then(function(details) {
                            log('✅ Payment captured successfully', 'success');
                            container.innerHTML = '<div class="status success">Payment successful!</div>';
                        });
                    },
                    onError: function(err) {
                        log(`❌ PayPal button error: ${err.message}`, 'error');
                        container.innerHTML = '<div class="status error">Payment failed</div>';
                    }
                });
                
                if (button.isEligible()) {
                    await button.render('#paypal-button-container');
                    log('✅ PayPal button rendered successfully', 'success');
                } else {
                    log('❌ PayPal button not eligible', 'error');
                    container.innerHTML = '<div class="status error">PayPal not available</div>';
                }
                
            } catch (error) {
                log(`❌ PayPal button test failed: ${error.message}`, 'error');
            }
        }
        
        // Auto-run SDK test on page load
        window.addEventListener('load', () => {
            log('Page loaded, starting tests...', 'info');
            setTimeout(testPayPalSDK, 1000);
        });
    </script>
</body>
</html>
